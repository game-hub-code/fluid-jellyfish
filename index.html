<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Fluid Medusae</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#000; width:100vw; height:100vh; }
  canvas { position:absolute; top:0; left:0; width:100vw; height:100vh; }
  #fluid { z-index: 1; }
  #medusa-container { position:absolute; top:0; left:0; width:100vw; height:100vh; z-index: 2; }
  #medusa-container canvas { position:absolute; top:0; left:0; }
</style>
</head>
<body>
<canvas id="fluid"></canvas>
<div id="medusa-container"></div>

<!-- fluid background (unchanged from earlier build) -->
<script src="https://cdn.jsdelivr.net/npm/webgl-fluid@0.4"></script>
<script>
WebGLFluid(document.getElementById('fluid'), {
  TRIGGER: 'hover',
  IMMEDIATE: true,
  SIM_RESOLUTION: 128,
  DYE_RESOLUTION: 1024,
  DENSITY_DISSIPATION: 1.5,
  VELOCITY_DISSIPATION: 0.9,
  SPLAT_RADIUS: 0.3,
  SPLAT_FORCE: 10000,
  CURL: 25,
  SHADING: true,
  COLORFUL: false,
  // Fixed jellyfish-bioluminescence palette (bulb pink -> deep purple),
  // matching the medusa's own BulbMaterial colors (0xFFA9D2 / 0x70256C)
  // instead of the library's default random-hue cycling.
  SPLAT_COLOR: { r: 0.85, g: 0.35, b: 0.75 },
  BACK_COLOR: { r: 0.02, g: 0.0, b: 0.05 },
  TRANSPARENT: false,
  BLOOM: true,
  BLOOM_INTENSITY: 0.01,
  SUNRAYS: false
});
</script>
  <script>
(function(){
  var THRESH=1.4, COOLDOWN=180, avg=0.02, last=0;

  // Path A: Lively system audio (works unattended, zero prompts).
  // Lively calls this automatically if it finds it in the page —
  // only fires when the wallpaper is added as .zip/folder with
  // "Arguments": "--audio" in LivelyInfo.json.
  window.livelyAudioListener = function(audioArray){
    var sum=0;
    for (var i=0;i<audioArray.length;i++) sum += audioArray[i]*audioArray[i];
    var rms = Math.sqrt(sum/audioArray.length);
    trigger(rms);
  };

  // Path B: mic, for the plain-browser GitHub Pages demo where
  // livelyAudioListener is never called. Needs a user click to grant.
  if (navigator.mediaDevices) {
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})
      .then(function(stream){
        var ctx=new (window.AudioContext||window.webkitAudioContext)();
        var analyser=ctx.createAnalyser(); analyser.fftSize=512;
        ctx.createMediaStreamSource(stream).connect(analyser);
        var data=new Uint8Array(analyser.frequencyBinCount);
        var resume=function(){ if(ctx.state==='suspended') ctx.resume(); };
        window.addEventListener('pointerdown',resume);
        window.addEventListener('keydown',resume);
        resume();
        (function tick(){
          analyser.getByteTimeDomainData(data);
          var sum=0; for(var i=0;i<data.length;i++){ var v=(data[i]-128)/128; sum+=v*v; }
          trigger(Math.sqrt(sum/data.length));
          requestAnimationFrame(tick);
        })();
      }).catch(function(){});
  }

  function trigger(rms){
    avg = avg*0.97 + rms*0.03;
    var now = performance.now();
    if (rms > avg*THRESH && rms > 0.05 && now-last > COOLDOWN){
      last = now;
      window.dispatchEvent(new KeyboardEvent('keydown',{key:' ',code:'Space'}));
    }
  }
})();
</script>
